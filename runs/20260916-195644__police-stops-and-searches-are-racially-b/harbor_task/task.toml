version = "1.0"

[task]
name = "astaverse/multiverse__nc-durham-stops_multiverse"
description = "Execute a multiverse analysis: sweep 256 analytic universes over the nc-durham-stops dataset and report per-universe statistics."

[metadata]
difficulty = "hard"
category = "data-analysis"
tags = ["astaverse", "multiverse", "specification-curve", "statistics"]
run_id = "20260916-195644__police-stops-and-searches-are-racially-b"
dataset = "nc-durham-stops"
n_universes = 256
astra_schema_shape = "0.0.13"

[agent]
# A grid sweep is substantially longer than a single analysis.
timeout_sec = 3600.0

[verifier]
timeout_sec = 300.0

# The verifier grades /app/results.md with an LLM judge (LiteLLM) and structurally
# checks /app/universes.jsonl. REWARDKIT_JUDGE selects the judge model.
[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
GEMINI_API_KEY = "${GEMINI_API_KEY}"
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE}"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
