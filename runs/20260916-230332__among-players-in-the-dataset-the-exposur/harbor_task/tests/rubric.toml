# Verifier for a MULTIVERSE task: grade /app/results.md against the decision
# specification (/tests/spec.txt).
#
# Note there is no `results_match_reference` criterion. There is no reference
# result here by construction — the point of the exercise is that the "right"
# answer is a distribution, not a number. (The sibling experiments repo also
# found that criterion brittle where the reference is not ground truth.)
#
# Judge model resolved from REWARDKIT_JUDGE at runtime; this is the fallback.
[judge]
judge = "openai/gpt-5-mini"
files = ["/app/results.md", "/app/analysis.py", "/tests/spec.txt"]

[[criterion]]
id = "1"
name = "faithful_decision_implementation"
description = "Does analysis.py implement each decision in spec.txt as described, with the choice driven by the `selections` argument rather than hard-coded?"
type = "likert"
points = 5

[[criterion]]
id = "2"
name = "parametric_structure"
description = "Is there a single `analyze(df, selections)` function that all universes pass through, with no per-universe special-casing or duplicated per-universe analysis code?"
type = "binary"

[[criterion]]
id = "3"
name = "comparable_estimand"
description = "Is the reported `estimate` the same quantity across all universes (so that the values are comparable), rather than switching between different statistics?"
type = "binary"

[[criterion]]
id = "4"
name = "reports_spread"
description = "Does results.md describe the spread of results across universes and which decisions moved the estimate most, rather than reporting only a single headline result?"
type = "likert"
points = 5

[[criterion]]
id = "5"
name = "no_verdict_smuggling"
description = "Does the report refrain from presenting one universe as the true or correct result while dismissing the others?"
type = "binary"

[scoring]
aggregation = "weighted_mean"
