version = "1.0"

[task]
name = "astaverse/multiverse__silberzahn-red-cards_multiverse"
description = "Execute a multiverse analysis: sweep 112 analytic universes over the silberzahn-red-cards dataset and report per-universe statistics."

[metadata]
difficulty = "hard"
category = "data-analysis"
tags = ["astaverse", "multiverse", "specification-curve", "statistics"]
run_id = "20260916-230332__among-players-in-the-dataset-the-exposur"
dataset = "silberzahn-red-cards"
n_universes = 112
astra_schema_shape = "0.0.13"

[agent]
# A grid sweep is substantially longer than a single analysis.
timeout_sec = 3600.0

[verifier]
timeout_sec = 300.0

# The verifier grades /app/results.md with an LLM judge (LiteLLM) and structurally
# checks /app/universes.jsonl. REWARDKIT_JUDGE selects the judge model.
[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
GEMINI_API_KEY = "${GEMINI_API_KEY}"
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE}"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
