id: silberzahn-red-cards_multiverse
name: 'silberzahn-red-cards: multiverse analysis'
description: Decision space extracted by mode 'direct'.
inputs:
- id: dataset
  type: data
  source: /Users/stevend/Desktop/Asta/astaverse/data/datasets/silberzahn-red-cards/data.csv
  description: Primary dataset under analysis
outputs:
- id: universe_stats
  type: table
  description: 'Per-universe statistics (estimate, estimate_standardized, std_error, std_error_standardized,
    95% standardized confidence interval, p_value, n, direction). Carries no verdict by design: verdicts
    are assigned downstream.'
  inputs:
  - dataset
  decisions:
  - exposure_and_event_model
  - fixed_covariate_adjustment
  - repeated_player_referee_structure
  - sendoff_outcome_definition
  - skin_tone_measurement_and_encoding
  - uncertainty_accounting
  recipe:
    command: python /app/analysis.py
decisions:
  sendoff_outcome_definition:
    label: Definition of a red-card outcome
    rationale: 'Should the outcome be straight red cards only, or all sendings-off including second-yellow
      cards?  [found by: direct]'
    default: straight_red_only
    options:
      straight_red_only:
        label: Straight red cards only
        description: Define the event count for each player-referee dyad as `redCards`; exclude `yellowReds`.
      all_sendings_off:
        label: Straight red or second-yellow sending-off
        description: Define the event count as `redCards + yellowReds` for each player-referee dyad.
    x_astaverse:
      kind: variable_choice
      post_hoc: false
      option_support:
        straight_red_only: []
        all_sendings_off: []
  skin_tone_measurement_and_encoding:
    label: Measurement and encoding of skin tone
    rationale: 'How should `rater1` and `rater2` be combined and represented as the exposure?  [found
      by: direct]'
    default: mean_continuous
    options:
      mean_continuous:
        label: Mean rater score as a continuous predictor
        description: Compute `skin_tone = (rater1 + rater2) / 2` and enter it as a linear predictor ranging
          from 0 to 1.
      mean_five_level_factor:
        label: Mean score as a five-level factor
        description: Compute `(rater1 + rater2) / 2` and treat the values 0, 0.25, 0.5, 0.75, and 1 as
          five indicator-coded categories, using 0 as the reference category.
      mean_binary_threshold:
        label: Binary light/dark classification
        description: Compute `(rater1 + rater2) / 2`; classify scores below 0.5 as light and scores greater
          than or equal to 0.5 as dark, then estimate the dark-versus-light contrast.
      rater1_continuous:
        label: First rater score as a continuous predictor
        description: Use `rater1` directly as a linear predictor from 0 to 1 and ignore `rater2`.
    x_astaverse:
      kind: variable_choice
      post_hoc: false
      option_support:
        mean_continuous: []
        mean_five_level_factor: []
        mean_binary_threshold: []
        rater1_continuous: []
  exposure_and_event_model:
    label: Model for event counts and game exposure
    rationale: 'How should the `redCards` or combined sending-off count be related to the number of games
      in `games`?  [found by: direct]'
    default: binomial_count_rate
    options:
      binomial_count_rate:
        label: Binomial rate model
        description: Use the selected sending-off count as the number of successes and `games` as the
          number of trials in a binomial regression; report the skin-tone odds ratio.
      dyad_any_event_logistic:
        label: Any-event logistic model
        description: Replace the selected sending-off count by an indicator equal to 1 when the dyad has
          at least one event and 0 otherwise; fit an unweighted logistic regression with one observation
          per dyad, without using `games` as a denominator.
      poisson_exposure_model:
        label: Count model with game exposure offset
        description: Model the selected sending-off count with Poisson regression and include `log(games)`
          as an offset, interpreting the skin-tone coefficient as a rate-ratio contrast rather than an
          odds ratio.
    x_astaverse:
      kind: model
      post_hoc: false
      option_support:
        binomial_count_rate: []
        dyad_any_event_logistic: []
        poisson_exposure_model: []
  repeated_player_referee_structure:
    label: Dependence from repeated players and referees
    rationale: 'How should the repeated observations for the same `playerShort` and `refNum` be represented
      in the model?  [found by: direct]'
    default: no_random_effects
    options:
      no_random_effects:
        label: No player or referee random effects
        description: Fit the selected event model with no random intercept for `playerShort` or `refNum`;
          any adjustment variables are included only as fixed effects.
      player_referee_random_intercepts:
        label: Random intercepts for player and referee
        description: Add independent random intercepts for `playerShort` and `refNum` to the selected
          regression model, while estimating the fixed effect of skin tone.
      referee_random_intercept_only:
        label: Random intercept for referee only
        description: Add a random intercept for `refNum` but not for `playerShort`, leaving player characteristics
          represented only by observed covariates.
    x_astaverse:
      kind: model
      post_hoc: false
      option_support:
        no_random_effects: []
        player_referee_random_intercepts: []
        referee_random_intercept_only: []
  fixed_covariate_adjustment:
    label: Adjustment for observed player, league, and referee characteristics
    rationale: 'Which variables in addition to skin tone should be included as fixed-effect covariates?  [found
      by: direct]'
    default: unadjusted
    options:
      unadjusted:
        label: Skin tone only
        description: Include no covariates beyond the selected skin-tone exposure and the selected outcome
          model.
      league_position_adjusted:
        label: League and position adjusted
        description: Include categorical `leagueCountry` and categorical `position` as fixed effects in
          addition to skin tone.
      player_characteristics_adjusted:
        label: Add player characteristics
        description: Include `leagueCountry`, `position`, `height`, `weight`, and birth year extracted
          from `birthday` as fixed effects in addition to skin tone.
      referee_bias_adjusted:
        label: Add referee-country bias measures
        description: Include `leagueCountry`, `position`, `height`, `weight`, birth year from `birthday`,
          `meanIAT`, and `meanExp` as fixed effects in addition to skin tone.
    x_astaverse:
      kind: variable_choice
      post_hoc: false
      option_support:
        unadjusted: []
        league_position_adjusted: []
        player_characteristics_adjusted: []
        referee_bias_adjusted: []
  uncertainty_accounting:
    label: Uncertainty calculation for repeated dyads
    rationale: 'How should standard errors or confidence intervals account for dependence among rows involving
      the same players and referees?  [found by: direct]'
    default: model_based_uncertainty
    options:
      model_based_uncertainty:
        label: Model-based standard errors
        description: Use the standard errors and confidence intervals implied by the selected regression
          model, with no additional clustering or resampling.
      two_way_clustered_uncertainty:
        label: Two-way clustered uncertainty
        description: Calculate sandwich standard errors clustered simultaneously by `playerShort` and
          `refNum`, using a multiway-cluster correction for their overlap.
      cluster_bootstrap_uncertainty:
        label: Cluster bootstrap
        description: Resample `playerShort` clusters and `refNum` clusters in a two-way cluster bootstrap,
          refit the complete model for each replicate, and use the bootstrap distribution for confidence
          intervals.
    x_astaverse:
      kind: inference
      post_hoc: false
      option_support:
        model_based_uncertainty: []
        two_way_clustered_uncertainty: []
        cluster_bootstrap_uncertainty: []
  verdict_rule:
    label: Verdict decision rule
    rationale: How the reported statistics become a supported / not-supported verdict. Left implicit by
      every plan, and consequential on its own.
    default: alpha_05_two_sided
    options:
      alpha_05_two_sided:
        label: p < 0.05, two-sided
        description: Conventional two-sided test at the 5% level.
      alpha_01_two_sided:
        label: p < 0.01, two-sided
        description: Stricter two-sided threshold at the 1% level.
      alpha_05_directional:
        label: p < 0.05 and direction matches
        description: Significant at 5% AND the estimate points the way the hypothesis predicts; a significant
          effect the other way counts as not supported.
    x_astaverse:
      kind: verdict_rule
      post_hoc: true
      option_support:
        alpha_05_two_sided: []
        alpha_01_two_sided: []
        alpha_05_directional: []
prior_insights:
  hypothesis:
    id: hypothesis
    label: Hypothesis under test
    claim: Referees are more likely to award red cards to dark-skinned players than to light-skinned players.
x_astaverse:
  astra_schema_shape: 0.0.13
  note: ASTRA-shaped, emitted by astaverse without astra-tools. Run `astra validate` to check conformance.
