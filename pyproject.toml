[project]
name = "astaverse"
version = "0.1.0"
description = "Multiverse analysis and robust surprisal for agentic scientific discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tyro>=0.9",
    "litellm>=1.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
astaverse = "astaverse.adapters.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astaverse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
